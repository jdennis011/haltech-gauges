; Haltech CAN gauge system
;   gauge         - Waveshare ESP32-S3-Touch-AMOLED-1.75 (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM)
;   gauge_bringup - first power-up checks for a gauge board (display, touch, header pins)
;   gauge_m5dial  - the gauge firmware on an M5Stack Dial (240 px), for development
;   hub           - ESP32-C6 dev board (two TWAI controllers: ECU bus + gauge bus)
;   hub_selftest  - loops the hub's two CAN controllers into each other
;   hub_dev_c3    - hub minus the ECU bridge, on a Lolin C3 Mini for bench development
;   native        - host unit tests for the shared libraries in lib/

[platformio]
default_envs = gauge, hub
; pioarduino installs its own fork of PlatformIO Core into the core dir's penv.
; Keeping it in a separate core dir leaves the stock ~/.platformio install untouched.
core_dir = ${sysenv.USERPROFILE}/.pioarduino

[esp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Registry release 1.0.1 predates recover()/restart() and the dual-controller path.
lib_can = https://github.com/handmade0octopus/ESP32-TWAI-CAN.git#01251a430f40f487d55ce7d472feee9702e7d7b6
lib_json = bblanchon/ArduinoJson@^7.4.0
test_ignore = test_native_*
; esptool's progress bar is drawn with Unicode block characters. On a Windows
; console with a legacy code page PlatformIO crashes echoing it, half way
; through the upload, so esptool is told to print only errors.
upload_flags = --silent

[gauge_board]
extends = esp
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/gauge_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; SensorLib and XPowersLib are the versions Waveshare validated on this board.
; Their GFX 1.6.4 does not compile against arduino-esp32 3.3.12, hence 1.6.8.
lib_display =
    moononournation/GFX Library for Arduino@1.6.8
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.6

[env:gauge]
extends = gauge_board
build_src_filter = +<gauge/> -<gauge/*_m5dial.cpp>
build_flags =
    ${gauge_board.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    ${esp.lib_can}
    ${esp.lib_json}
    ${gauge_board.lib_display}
    lvgl/lvgl@9.4.0

[env:gauge_bringup]
extends = gauge_board
build_src_filter = +<gauge_bringup/>
lib_deps =
    ${gauge_board.lib_display}

; The same gauge firmware on an M5Stack Dial (StampS3: ESP32-S3, 8 MB flash,
; no PSRAM, 240 px GC9A01). CAN transceiver on Port B: GPIO1 TX, GPIO2 RX.
[env:gauge_m5dial]
extends = esp
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
build_src_filter = +<gauge/> -<gauge/*_waveshare.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DHG_BOARD_M5DIAL=1
    -DHG_SCREEN_SIZE=240
lib_deps =
    ${esp.lib_can}
    ${esp.lib_json}
    m5stack/M5Dial@^1.0.3
    lvgl/lvgl@9.4.0

; Shared by the hub builds: CAN, config parsing and the Wi-Fi web UI, which
; scripts/embed_web.py embeds from web/ and assets/ before each build.
[hub_common]
extends = esp
board_build.filesystem = littlefs
build_src_filter = +<hub/>
extra_scripts = pre:scripts/embed_web.py
; Each queued WebSocket message holds a copy of the payload, so the queue is kept short.
build_flags = -DWS_MAX_QUEUED_MESSAGES=4
lib_deps =
    ${esp.lib_can}
    ${esp.lib_json}
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0

[env:hub]
extends = hub_common
board = esp32-c6-devkitc-1
board_build.partitions = default_8MB.csv

; The hub on the Waveshare ESP32-P4-WIFI6 (ESP32-P4 revision 3, 32 MB flash, 32 MB PSRAM;
; electrical-spec.md section 5). Wi-Fi is the board's ESP32-C6 over SDIO, which the core's
; ESP-Hosted build already expects on exactly this board's pins. The USB-C port is a CH343
; UART on UART0, so the console is Serial without USB CDC; two 4.5 MB app slots and 23 MB
; of LittleFS for configs, recordings and images.
[env:hub_p4]
extends = hub_common
board = esp32-p4_r3-evboard
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_build.partitions = large_littlefs_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432

; The P4 hub talking to a copy of the site running on this PC (`npx wrangler dev --port 8787
; --ip 0.0.0.0`) instead of oagauge.online, for testing cloud sync: set HUB_CLOUD_URL in the
; environment, e.g. http://192.168.1.10:8787, before building.
[env:hub_p4_local]
extends = env:hub_p4
build_flags = ${hub_common.build_flags} -DHUB_CLOUD_URL=\"${sysenv.HUB_CLOUD_URL}\"

; One-off for a new Waveshare ESP32-P4-WIFI6: updates its ESP32-C6 to the ESP-Hosted slave
; firmware this core expects, over the SDIO link (src/hub_p4_c6update). The file is the
; core's own, copied from ~/.pioarduino/packages/framework-arduinoespressif32-libs/hosted/
; into tools/hosted/ (gitignored). Flash it, watch the serial output, flash hub_p4 again.
[env:hub_p4_c6update]
extends = env:hub_p4
build_src_filter = +<hub_p4_c6update/>
board_build.embed_files = tools/hosted/esp32c6-v2.12.13.bin

; One-off: makes the P4 a serial bridge to its own ESP32-C6's 4-pin header with the C6 in
; download mode, so esptool on the board's USB-C port can reflash the C6 when the SDIO
; update is refused (src/hub_p4_c6bridge has the three jumpers and the esptool command).
[env:hub_p4_c6bridge]
extends = env:hub_p4
build_src_filter = +<hub_p4_c6bridge/>

[env:hub_selftest]
extends = env:hub
build_src_filter = +<hub_selftest/>

; Development stand-in for the hub on a Lolin C3 Mini (an ESP32-C3 SuperMini
; builds the same way): one CAN controller, so the gauge bus only (beacon,
; roster, simulator, config push, web UI) and no ECU bridge. 4 MB flash: one
; 3 MB app slot, no OTA. Serial console on the native USB port.
[env:hub_dev_c3]
extends = hub_common
board = lolin_c3_mini
board_build.partitions = huge_app.csv

[env:native]
platform = native
test_framework = unity
test_filter = test_native_*
build_flags = -std=gnu++17
lib_deps =
    ${esp.lib_json}
